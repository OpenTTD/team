name: Testing (Python)

on:
  pull_request:

concurrency:
  group: testing-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    name: CodeQL
    uses: OpenTTD/actions/.github/workflows/rw-py-codeql.yml@v7
    with:
      python-version: 3.15
      source-root: .

  flake8:
    name: Flake8
    uses: OpenTTD/actions/.github/workflows/rw-py-flake8.yml@v7
    with:
      python-path: request_access

  black:
    name: Black
    uses: OpenTTD/actions/.github/workflows/rw-py-black.yml@v7
    with:
      python-version: 3.15
      python-path: request_access

  annotation_check:
    name: Annotation Check
    needs:
    - flake8
    - black
    # not codeql, as that reports its own status

    if: always() && github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - name: Check annotations
        uses: OpenTTD/actions/annotation-check@v7
