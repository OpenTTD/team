name: New comment

on:
  issue_comment:
    types:
    - created

jobs:
  new_comment:
    name: New comment
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request == false && github.actor != 'DorpsGek'

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python 3.15
      uses: actions/setup-python@v7
      with:
        python-version: 3.15
        cache: 'pip'
    - name: Install dependencies
      run: |
        pip install -U pip
        pip install -r requirements.txt
    - name: New comment
      run: |
        python -m request_access --new-comment
      env:
        GITHUB_TOKEN: ${{ secrets.DORPSGEK_TOKEN }}
